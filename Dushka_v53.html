<script>
(()=>{const root=document.getElementById('dushka-demo'),modal=root.querySelector('#modal'),now=new Date();let selectedDate=new Date(now.getFullYear(),now.getMonth(),now.getDate()),taskDate=new Date(selectedDate),group='',cat='',customGroups=JSON.parse(localStorage.getItem('dushka_custom_groups')||'[]');const months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],weekdays=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];const key=d=>d.toISOString().slice(0,10),fmt=d=>d.getDate()+' '+months[d.getMonth()];root.querySelector('#current-date').textContent=weekdays[now.getDay()]+', '+fmt(now);root.querySelector('#task-list-date').textContent=fmt(selectedDate);const taskCard=root.querySelector('#task-list-date').closest('.card'),taskList=document.createElement('div');taskList.id='taskList';[...taskCard.querySelectorAll('.task')].forEach(e=>taskList.appendChild(e));taskCard.appendChild(taskList);const initialTasks=[...taskList.querySelectorAll('.task')].map((el,i)=>({id:i+1,title:el.querySelector('.title').textContent,group:el.dataset.group||'',cat:el.dataset.cat||'',date:key(selectedDate),done:false}));const savedTasks=JSON.parse(localStorage.getItem('dushka_tasks')||'null');let tasks=[];if(Array.isArray(savedTasks)){taskList.innerHTML='';savedTasks.forEach(t=>{const el=document.createElement('div');el.className='task';taskList.appendChild(el);tasks.push({...t,el})})}else{tasks=initialTasks.map(t=>{const el=taskList.querySelectorAll('.task')[t.id-1];return {...t,el}});localStorage.setItem('dushka_tasks',JSON.stringify(initialTasks))}let nextId=tasks.reduce((m,t)=>Math.max(m,Number(t.id)||0),0)+1;function saveData(){localStorage.setItem('dushka_tasks',JSON.stringify(tasks.map(({el,...t})=>t)));localStorage.setItem('dushka_custom_groups',JSON.stringify(customGroups))}function paint(t){t.el.dataset.group=t.group;t.el.dataset.cat=t.cat;t.el.className='task '+(t.cat==='Важно'?'task-red':t.cat==='Средне срочно'?'task-yellow':t.cat==='Отложить'?'task-green':'');if(t.done)t.el.classList.add('done');t.el.innerHTML='<button class="delete-task" type="button" aria-label="Удалить задачу" title="Удалить">×</button><button class="check" type="button">'+(t.done?'✓':'')+'</button><div class="taskbody"><div class="title"></div><div class="task-options"><button class="select-mini group-edit" type="button">'+(t.group==='Работа'?'💼⌄':t.group==='Дом'?'🏠⌄':t.group?'📁⌄':'⌄')+'</button><button class="select-mini cat-edit" type="button">'+(t.cat==='Важно'?'🔴⌄':t.cat==='Средне срочно'?'🟡⌄':t.cat==='Отложить'?'🟢⌄':'⌄')+'</button></div></div>';t.el.querySelector('.title').textContent=t.title;t.el.querySelector('.check').onclick=()=>{t.done=!t.done;paint(t);saveData();updateProgress()};t.el.querySelector('.delete-task').onclick=()=>{const idx=tasks.indexOf(t);if(idx!==-1)tasks.splice(idx,1);t.el.remove();saveData();renderTasks();renderFilterButtons()};t.el.querySelector('.group-edit').onclick=()=>{const all=['','Работа','Дом',...customGroups];t.group=all[(all.indexOf(t.group)+1)%all.length];paint(t);saveData();renderFilterButtons()};t.el.querySelector('.cat-edit').onclick=()=>{const all=['','Важно','Средне срочно','Отложить'];t.cat=all[(all.indexOf(t.cat)+1)%all.length];paint(t);saveData()};};function renderTasks(){tasks.forEach(t=>t.el.style.display=t.date===key(selectedDate)?'flex':'none');root.querySelector('#task-list-date').textContent=fmt(selectedDate);updateProgress()}function updateProgress(){const visible=tasks.filter(t=>t.date===key(selectedDate)),done=visible.filter(t=>t.done).length,total=visible.length,p=total?done/total:0;root.querySelector('#progressText').textContent=done+' / '+total+' выполнено';root.querySelector('#progressPercent').textContent=Math.round(p*100)+'%';root.querySelector('#progressBar').style.width=(p*100)+'%';root.querySelector('#completionWash').style.transform='scaleY('+p+')'}tasks.forEach(paint);function selectDate(d){selectedDate=new Date(d.getFullYear(),d.getMonth(),d.getDate());taskDate=new Date(selectedDate);renderTasks();renderQuickDates(true)}function renderQuickDates(center){const q=root.querySelector('#quickDates');q.innerHTML='';for(let offset=-30;offset<=30;offset++){const d=new Date(selectedDate);d.setDate(selectedDate.getDate()+offset);const b=document.createElement('button');b.className='quick-date'+(key(d)===key(selectedDate)?' selected':'');b.innerHTML='<strong>'+d.getDate()+'</strong><span>'+['вс','пн','вт','ср','чт','пт','сб'][d.getDay()]+'</span>';b.onclick=()=>{if(!dragMoved)selectDate(d)};q.appendChild(b)}if(center){const active=q.querySelector('.selected');if(active)requestAnimationFrame(()=>active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}))}}renderQuickDates(true);renderTasks();const qdates=root.querySelector('#quickDates');let drag=false,startX=0,startScroll=0,dragMoved=false;qdates.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();qdates.scrollLeft+=e.deltaY}},{passive:false});qdates.addEventListener('pointerdown',e=>{drag=true;dragMoved=false;startX=e.clientX;startScroll=qdates.scrollLeft;qdates.setPointerCapture(e.pointerId)});qdates.addEventListener('pointermove',e=>{if(drag){if(Math.abs(e.clientX-startX)>6)dragMoved=true;qdates.scrollLeft=startScroll-(e.clientX-startX)}});qdates.addEventListener('pointerup',()=>{drag=false;setTimeout(()=>dragMoved=false,0)});qdates.addEventListener('pointercancel',()=>drag=false);root.querySelector('#addBtn').onclick=()=>{group='';cat='';taskDate=new Date(selectedDate);root.querySelector('#newTask').value='';root.querySelector('#chosenTaskDate').textContent=fmt(taskDate);root.querySelectorAll('.groupPick,.catPick').forEach(x=>x.style.outline='');modal.classList.add('open')};root.querySelector('#closeModal').onclick=()=>modal.classList.remove('open');root.querySelector('#closeModalTop').onclick=()=>modal.classList.remove('open');root.querySelectorAll('.groupPick').forEach(b=>b.o
