<div id="dushka-demo">
<style>
#dushka-demo{font-family:system-ui,-apple-system,sans-serif;max-width:520px;margin:auto;background:#f7f5ff;color:#24212d;padding:22px 16px 30px;border-radius:28px;position:relative;overflow:hidden}#dushka-demo .completion-wash{position:absolute;inset:0;background:linear-gradient(180deg,#7048ff,#9278ff);opacity:.34;transform:translateY(100%);transition:transform .6s ease;pointer-events:none;z-index:0}#dushka-demo>*:not(.completion-wash){position:relative;z-index:1}
#dushka-demo .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}#dushka-demo h1{margin:0;font-size:28px}#dushka-demo .date{color:#777;font-size:14px;margin-bottom:18px}
#dushka-demo .progress{background:#ebe7f5;border-radius:10px;height:9px;overflow:hidden}.bar{height:100%;width:58%;background:#7c5cff;border-radius:10px}.stats{display:flex;justify-content:space-between;font-size:13px;color:#777;margin-bottom:9px}
#dushka-demo .card{background:#fff;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 7px 25px #0000000a}.quick-dates{display:flex;gap:10px;overflow-x:auto;padding:3px 10px 7px;margin:12px -16px 0;scrollbar-width:none;scroll-snap-type:x proximity}.quick-dates::-webkit-scrollbar{display:none}.quick-date{min-width:38px;width:38px;height:38px;border:0;background:transparent;border-radius:50%;padding:0;font-size:11px;flex:none;scroll-snap-align:center;color:#625b72}.quick-date strong{display:block;font-size:16px;line-height:18px}.quick-date.selected{background:#7c5cff;color:#fff;font-weight:700;box-shadow:0 0 0 3px #e3dcff}.filter-wrap{margin-bottom:10px}.filter-toggle{width:100%;border:0;background:#f0edf7;border-radius:14px;padding:10px 13px;text-align:left;font-size:14px;font-weight:650}.filters{display:none;gap:7px;flex-wrap:wrap;margin-top:7px;padding:8px;background:#faf9fd;border-radius:15px}.filters.open{display:flex}.chip{border:0;background:#f0edf7;border-radius:14px;padding:8px 11px;white-space:nowrap;font-size:13px}.chip.active{background:#24212d;color:#fff}.gear{border:0;background:#f0edf7;border-radius:12px;padding:8px 11px;font-size:16px}.setting-title{font-size:12px;color:#8a8496;margin:12px 0 7px}.task-options{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}.select-mini{border:0;background:transparent;border-radius:8px;padding:1px 2px;font-size:16px;color:#625b72}.modal{display:none;position:absolute;inset:0;background:#0005;align-items:flex-end;justify-content:center;padding:12px}.modal.open{display:flex}.sheet{background:#fff;border-radius:24px;padding:18px;width:100%;max-width:480px}.sheet input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd6ef;border-radius:13px;font-size:16px;margin:8px 0}.sheet button{border:0;border-radius:13px;padding:11px 14px;margin:4px;background:#f0edf7}.sheet .primary{background:#7c5cff;color:#fff}.calendar-demo{display:none;margin-top:12px}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}.calendar-head button{border:0;background:#f0edf7;border-radius:10px;padding:6px 10px}.calendar-week,.calendar-month{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar-week{text-align:center;font-size:11px;color:#8a8496;margin-bottom:5px}.calendar-month button{position:relative;border:0;background:#f5f2fa;border-radius:12px;min-height:42px;padding:7px 2px}.calendar-month button.selected-date{background:#7c5cff;color:#fff;font-weight:700}.calendar-month button.today-date{box-shadow:inset 0 0 0 2px #c8bfff}.calendar-month button.has-tasks:after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#7c5cff}.calendar-month button.selected-date.has-tasks:after{background:#fff}.task-red{background:#fbe8ed;border-left:5px solid #d85c67;padding:14px 10px!important;border-radius:14px}.task-yellow{background:#fff4d8;border-left:5px solid #e0b44f;padding:14px 10px!important;border-radius:14px}.task-green{background:#e9f4e9;border-left:5px solid #72a66b;padding:14px 10px!important;border-radius:14px}.task-gray{background:#f0f0f0;border-left:5px solid #aaa;padding:14px 10px!important;border-radius:14px}
#dushka-demo .settings-sheet{display:none;background:#fff;border-radius:18px;padding:14px;margin:10px 0}.settings-sheet.open{display:block}.group-item,.add-group{border:0;background:#f0edf7;border-radius:12px;padding:9px 11px;margin:3px}.settings-actions{display:flex;gap:7px;flex-wrap:wrap}.empty-note{font-size:13px;color:#8a8496;text-align:center;padding:14px}
.task{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid #eee;align-items:flex-start;transition:opacity .35s ease}.task:last-child{border-bottom:0}.task:not(.task-red):not(.task-yellow):not(.task-green){opacity:.42}.task.done{opacity:.34!important}.task-red.done,.task-yellow.done,.task-green.done{opacity:.34!important}.check{width:24px;height:24px;border:2px solid #bbb4ce;border-radius:50%;flex:none}.taskbody{flex:1;min-width:0}.title{font-weight:650}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.badge{font-size:11px;border-radius:9px;padding:4px 7px;background:#f0edf7;color:#625b72}.important{background:#fbe8ed;color:#a63d55}.work{background:#e9e5ff;color:#5b4bb0}.home{background:#e9f4e9;color:#46724b}.personal{background:#fff0d9;color:#875b20}
.voice{width:100%;border:0;border-radius:19px;background:#7c5cff;color:#fff;padding:16px;font-size:17px;font-weight:700;margin-top:8px}.hint{font-size:12px;color:#8a8496;margin-top:9px;text-align:center}.task-input{background:#000!important;color:#fff!important}.task-input::placeholder{color:#d8d8d8}
</style>
<div class="top"><h1>Душка 💜</h1><div style="display:flex;gap:8px"><button class="gear" type="button" id="addBtn" aria-label="Новая задача">＋</button><button class="gear" type="button" id="calBtn" aria-label="Календарь">📅</button><button class="gear" type="button" id="paramBtn" aria-label="Параметры">⚙️</button></div></div><div class="date" id="current-date"></div>

<div style="font-size:17px;font-weight:700;margin-bottom:10px">Список задач на <span id="task-list-date"></span></div>
<div class="filter-wrap"><button class="filter-toggle" type="button" id="filterToggle">☰ Фильтр</button><div class="filters" id="groupFilters"><button class="chip active" type="button" data-group="all">Все</button><button class="chip" type="button" data-group="Работа">💼 Работа</button><button class="chip" type="button" data-group="Дом">🏠 Дом</button><button class="chip" type="button" data-cat="Важно">🔴 Важно</button><button class="chip" type="button" data-cat="Средне срочно">🟡 Средне срочно</button><button class="chip" type="button" data-cat="Отложить">🟢 Отложить</button></div></div>

<div class="task task-red" data-group="Работа" data-cat="Важно"><button class="check" type="button" aria-label="Выполнить задачу"></button><div class="taskbody"><div class="title">Оплатить интернет</div><div class="badges"></div><div class="task-options"><button class="select-mini" type="button" aria-label="Выбрать группу">💼⌄</button><button class="select-mini" type="button" aria-label="Выбрать цвет">🔴⌄</button></div></div></div>

<div class="settings-sheet" id="settingsSheet"><div class="group-list" id="settingsGroups"></div><div id="newGroupForm" style="display:none;margin-top:8px"><input id="newGroupName" placeholder="Название группы" style="width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd6ef;border-radius:12px"><button type="button" class="primary" id="saveGroupBtn">Сохранить</button><button type="button" id="cancelGroupBtn">Отмена</button></div></div>
<div class="modal" id="modal"><div class="sheet"><b id="sheetTitle">Новая задача</b><input class="task-input" id="newTask" placeholder="Что нужно сделать?"/><div class="setting-title">Дата</div><button type="button" id="pickTaskDate">📅 Выбрать дату</button><div id="chosenTaskDate" class="badge"></div><div id="taskGroupChoices"><button type="button" class="groupPick" data-value="Работа">💼 Работа</button><button type="button" class="groupPick" data-value="Дом">🏠 Дом</button></div><div class="setting-title">Срочность</div><div id="taskCatChoices"><button type="button" class="catPick" data-value="Важно">🔴 Важно</button><button type="button" class="catPick" data-value="Средне срочно">🟡 Средне срочно</button><button type="button" class="catPick" data-value="Отложить">🟢 Отложить на потом</button></div><div style="text-align:right;margin-top:8px"><button type="button" id="closeModal">Отмена</button><button type="button" class="primary" id="saveTask">Добавить</button></div></div></div>
<div class="modal" id="calendarModal"><div class="sheet"><div class="calendar-head"><button id="prevMonth">‹</button><span id="calendarTitle"></span><button id="nextMonth">›</button></div><div class="calendar-week"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div class="calendar-month" id="calendarMonth"></div><div style="text-align:right;margin-top:10px"><button type="button" id="closeCalendar">Закрыть</button></div></div></div>
<script>
(()=>{const root=document.getElementById('dushka-demo'),modal=root.querySelector('#modal'),now=new Date();let selectedDate=new Date(now.getFullYear(),now.getMonth(),now.getDate()),taskDate=new Date(selectedDate),group='',cat='',customGroups=[];const months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],weekdays=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];const key=d=>d.toISOString().slice(0,10),fmt=d=>d.getDate()+' '+months[d.getMonth()];root.querySelector('#current-date').textContent=weekdays[now.getDay()]+', '+fmt(now);root.querySelector('#task-list-date').textContent=fmt(selectedDate);const tasks=[...root.querySelectorAll('.task')].map((el,i)=>({id:i+1,title:el.querySelector('.title').textContent,group:el.dataset.group||'',cat:el.dataset.cat||'',date:key(selectedDate),done:false,el}));let nextId=tasks.length+1;function paint(t){t.el.dataset.group=t.group;t.el.dataset.cat=t.cat;t.el.className='task '+(t.cat==='Важно'?'task-red':t.cat==='Средне срочно'?'task-yellow':t.cat==='Отложить'?'task-green':'');if(t.done)t.el.classList.add('done');t.el.innerHTML='<button class="check" type="button">'+(t.done?'✓':'')+'</button><div class="taskbody"><div class="title"></div><div class="task-options"><button class="select-mini group-edit" type="button">'+(t.group==='Работа'?'💼⌄':t.group==='Дом'?'🏠⌄':t.group?'📁⌄':'⌄')+'</button><button class="select-mini cat-edit" type="button">'+(t.cat==='Важно'?'🔴⌄':t.cat==='Средне срочно'?'🟡⌄':t.cat==='Отложить'?'🟢⌄':'⌄')+'</button></div></div>';t.el.querySelector('.title').textContent=t.title;t.el.querySelector('.check').onclick=()=>{t.done=!t.done;paint(t);updateProgress()};t.el.querySelector('.group-edit').onclick=()=>{const all=['','Работа','Дом',...customGroups];t.group=all[(all.indexOf(t.group)+1)%all.length];paint(t);renderFilterButtons()};t.el.querySelector('.cat-edit').onclick=()=>{const all=['','Важно','Средне срочно','Отложить'];t.cat=all[(all.indexOf(t.cat)+1)%all.length];paint(t)};};function renderTasks(){tasks.forEach(t=>t.el.style.display=t.date===key(selectedDate)?'flex':'none');root.querySelector('#task-list-date').textContent=fmt(selectedDate);updateProgress()}function updateProgress(){const visible=tasks.filter(t=>t.date===key(selectedDate)),done=visible.filter(t=>t.done).length,total=visible.length,p=total?Math.round(done/total*100):0;root.querySelector('#progressText').textContent=done+' / '+total+' выполнено';root.querySelector('#progressPercent').textContent=p+'%';root.querySelector('#progressBar').style.width=p+'%';root.querySelector('#completionWash').style.transform='translateY('+(100-p)+'%)'}tasks.forEach(paint);function selectDate(d){selectedDate=new Date(d.getFullYear(),d.getMonth(),d.getDate());taskDate=new Date(selectedDate);renderTasks();renderQuickDates()}function renderQuickDates(){const q=root.querySelector('#quickDates');q.innerHTML='';for(let offset=-14;offset<=14;offset++){const d=new Date(now);d.setDate(now.getDate()+offset);const b=document.createElement('button');b.className='quick-date'+(key(d)===key(selectedDate)?' selected':'');b.dataset.day=d.getDate();b.dataset.month=d.getMonth();b.dataset.year=d.getFullYear();b.innerHTML='<strong>'+d.getDate()+'</strong><span>'+['вс','пн','вт','ср','чт','пт','сб'][d.getDay()]+'</span>';b.onclick=()=>selectDate(d);q.appendChild(b)}}renderQuickDates();renderTasks();root.querySelector('#addBtn').onclick=()=>{group='';cat='';taskDate=new Date(selectedDate);root.querySelector('#newTask').value='';root.querySelector('#chosenTaskDate').textContent=fmt(taskDate);root.querySelectorAll('.groupPick,.catPick').forEach(x=>x.style.outline='');modal.classList.add('open')};root.querySelector('#closeModal').onclick=()=>modal.classList.remove('open');root.querySelectorAll('.groupPick').forEach(b=>b.onclick=()=>{group=b.dataset.value;root.querySelectorAll('.groupPick').forEach(x=>x.style.outline='');b.style.outline='2px solid #7c5cff'});root.querySelectorAll('.catPick').forEach(b=>b.onclick=()=>{cat=b.dataset.value;root.querySelectorAll('.catPick').forEach(x=>x.style.outline='');b.style.outline='2px solid #7c5cff'});root.querySelector('#pickTaskDate').onclick=()=>{root.querySelector('#calendarModal').classList.add('open');renderCalendar(true)};root.querySelector('#saveTask').onclick=()=>{const raw=root.querySelector('#newTask').value.trim();if(!raw)return;const el=document.createElement('div');el.className='task';root.querySelector('.card').appendChild(el);const t={id:nextId++,title:raw,group,cat,date:key(taskDate),done:false,el};tasks.push(t);paint(t);modal.classList.remove('open');renderTasks();renderFilterButtons()};const addGroup=()=>{root.querySelector('#newGroupForm').style.display='block';root.querySelector('#newGroupName').focus()};root.querySelector('#paramBtn').onclick=()=>{root.querySelector('#settingsSheet').classList.toggle('open');renderSettingsGroups()};function renderSettingsGroups(){const box=root.querySelector('#settingsGroups');box.innerHTML='<button type="button" class="group-item">💼 Работа</button><button type="button" class="group-item">🏠 Дом</button>';customGroups.forEach(n=>{const b=document.createElement('button');b.type='button';b.className='group-item';b.textContent='📁 '+n;box.appendChild(b)});const b=document.createElement('button');b.type='button';b.className='add-group';b.textContent='＋ Добавить группу';b.onclick=addGroup;box.appendChild(b)}renderSettingsGroups();root.querySelector('#cancelGroupBtn').onclick=()=>{root.querySelector('#newGroupForm').style.display='none';root.querySelector('#newGroupName').value=''};root.querySelector('#saveGroupBtn').onclick=()=>{const n=root.querySelector('#newGroupName').value.trim();if(!n||customGroups.includes(n))return;customGroups.push(n);root.querySelector('#newGroupForm').style.display='none';root.querySelector('#newGroupName').value='';const b=document.createElement('button');b.type='button';b.className='groupPick';b.dataset.value=n;b.textContent='📁 '+n;b.onclick=()=>{group=n;root.querySelectorAll('.groupPick').forEach(x=>x.style.outline='');b.style.outline='2px solid #7c5cff'};root.querySelector('#taskGroupChoices').appendChild(b);renderSettingsGroups();renderFilterButtons()};function renderFilterButtons(){const box=root.querySelector('#groupFilters');box.innerHTML='<button class="chip active" type="button" data-group="all">Все</button><button class="chip" type="button" data-group="Работа">💼 Работа</button><button class="chip" type="button" data-group="Дом">🏠 Дом</button>'+customGroups.map(n=>'<button class="chip" type="button" data-group="'+n.replace(/"/g,'&quot;')+'">📁 '+n+'</button>').join('')+'<button class="chip" type="button" data-cat="Важно">🔴 Важно</button><button class="chip" type="button" data-cat="Средне срочно">🟡 Средне срочно</button><button class="chip" type="button" data-cat="Отложить">🟢 Отложить</button>';box.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const g=b.dataset.group,c=b.dataset.cat;box.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));tasks.forEach(t=>t.el.style.display=t.date===key(selectedDate)&&(g==='all'||t.group===g||t.cat===c)?'flex':'none')};}renderFilterButtons();let calendarMonth=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);root.querySelector('#calBtn').onclick=()=>{calendarMonth=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);root.querySelector('#calendarModal').classList.add('open');renderCalendar(false)};root.querySelector('#closeCalendar').onclick=()=>root.querySelector('#calendarModal').classList.remove('open');root.querySelector('#prevMonth').onclick=()=>{calendarMonth.setMonth(calendarMonth.getMonth()-1);renderCalendar(false)};root.querySelector('#nextMonth').onclick=()=>{calendarMonth.setMonth(calendarMonth.getMonth()+1);renderCalendar(false)};function renderCalendar(forTask){const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth(),names=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];root.querySelector('#calendarTitle').textContent=names[m]+' '+y;const grid=root.querySelector('#calendarMonth');grid.innerHTML='';const first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++)grid.appendChild(document.createElement('span'));for(let d=1;d<=days;d++){const b=document.createElement('button');b.textContent=d;const date=new Date(y,m,d);if(tasks.some(t=>t.date===key(date)))b.classList.add('has-tasks');if(key(date)===key(selectedDate))b.classList.add('selected-date');if(key(date)===key(now))b.classList.add('today-date');b.onclick=()=>{if(forTask){taskDate=date;root.querySelector('#chosenTaskDate').textContent=fmt(date);root.querySelector('#calendarModal').classList.remove('open')}else{selectDate(date);root.querySelector('#calendarModal').classList.remove('open')}};grid.appendChild(b)}}root.querySelector('#filterToggle').onclick=()=>root.querySelector('#groupFilters').classList.toggle('open');root.querySelector('#voiceBtn').onclick=()=>alert('Голосовой ввод: дата и текст задачи сохраняются отдельно. Например: «23 августа позвонить Вове» → дата 23 августа, задача «Позвонить Вове».')})()
</script>
</div>
